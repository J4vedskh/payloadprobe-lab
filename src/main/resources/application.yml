server:
  port: 8080

spring:
  application:
    name: payloadprobe-lab

logging:
  structured:
    format:
      console: logstash

payloadprobe:
  store:
    path: ${PAYLOADPROBE_STORE_PATH:data/xmlResponses.json}
  validation:
    max-payload-bytes: ${PAYLOADPROBE_MAX_PAYLOAD_BYTES:262144}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
