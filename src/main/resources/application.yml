server:
  port: 8080

spring:
  application:
    name: payloadprobe-lab

logging:
  structured:
    format:
      console: logstash

payloadprobe:
  store:
    path: ${PAYLOADPROBE_STORE_PATH:data/xmlResponses.json}
  validation:
    max-payload-bytes: ${PAYLOADPROBE_MAX_PAYLOAD_BYTES:262144}
  response-sets:
    max-entries: ${PAYLOADPROBE_RESPONSE_SET_MAX_ENTRIES:100}
    max-document-bytes: ${PAYLOADPROBE_RESPONSE_SET_MAX_DOCUMENT_BYTES:1048576}
  scenarios:
    path: ${PAYLOADPROBE_SCENARIOS_PATH:data/scenarios.json}
    max-scenarios: ${PAYLOADPROBE_SCENARIO_MAX_SCENARIOS:100}
    max-response-keys: ${PAYLOADPROBE_SCENARIO_MAX_RESPONSE_KEYS:100}
    max-document-bytes: ${PAYLOADPROBE_SCENARIO_MAX_DOCUMENT_BYTES:65536}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
