server:
  port: 8080

spring:
  application:
    name: payloadprobe-lab

payloadprobe:
  store:
    path: ${PAYLOADPROBE_STORE_PATH:data/xmlResponses.json}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
