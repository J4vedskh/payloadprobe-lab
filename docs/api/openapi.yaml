openapi: 3.0.3
info:
  title: PayloadProbe Lab API
  version: 0.7.0
  description: >-
    API for managing named XML mock responses. Write endpoints accept non-empty,
    well-formed XML documents or fragments and preserve accepted payload text.
    Write Bearer authentication is disabled by default. Set
    PAYLOADPROBE_WRITE_AUTH_ENABLED=true and provide
    PAYLOADPROBE_WRITE_AUTH_BEARER_TOKEN to require the documented Bearer token
    on write operations; read operations remain unauthenticated.
servers:
  - url: https://j4vedskh.github.io/payloadprobe-lab
    description: Documentation site
  - url: http://localhost:8080
    description: Local development
paths:
  /api/response-sets:
    get:
      summary: Export the current response catalog
      description: >-
        Returns the version 1 response-set document. The export is rejected if
        its configured entry or raw JSON size limit would be exceeded.
      responses:
        "200":
          description: Versioned response-set document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSetDocument"
        "409":
          $ref: "#/components/responses/ResponseSetExportTooLarge"
    post:
      summary: Add a response set without overwriting existing keys
      description: >-
        Validates every entry before changing storage. The import is additive:
        any existing key rejects the whole request. A successful merge uses an
        atomic replacement file in the same directory. Defaults are 100 entries,
        1,048,576 raw JSON bytes, and 262,144 UTF-8 bytes per XML value.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResponseSetImportDocument"
      security:
        - {}
        - WriteBearerAuth: []
      responses:
        "201":
          description: Number of newly imported responses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSetImportResponse"
        "400":
          $ref: "#/components/responses/InvalidResponseSetDocument"
        "409":
          $ref: "#/components/responses/ResponseSetConflict"
        "413":
          $ref: "#/components/responses/ResponseSetTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedJsonMediaType"
        "401":
          $ref: "#/components/responses/WriteAuthenticationRequired"
        "503":
          $ref: "#/components/responses/ResponseSetPersistenceFailure"
  /api/scenarios:
    get:
      summary: List named response scenarios
      description: >-
        Returns deterministic scenario metadata without XML payloads. The
        configurable scenario catalog limit defaults to 100.
      responses:
        "200":
          description: Scenario catalog ordered by name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadScenarioCatalogResponse"
  /api/scenarios/{name}:
    parameters:
      - $ref: "#/components/parameters/ScenarioName"
    get:
      summary: Resolve a scenario as a response set
      description: >-
        Resolves every referenced response from one catalog snapshot and
        preserves the scenario's declared order. The returned version 1
        document can be submitted to POST /api/response-sets on a catalog that
        does not already contain its response keys.
      responses:
        "200":
          description: Portable version 1 response set
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResponseSetDocument"
        "400":
          $ref: "#/components/responses/InvalidScenarioDocument"
        "404":
          $ref: "#/components/responses/ScenarioNotFound"
        "409":
          $ref: "#/components/responses/ScenarioUnavailable"
    put:
      summary: Create or replace a named scenario
      description: >-
        Atomically stores a non-empty, ordered, duplicate-free selection of
        currently available response keys. Returns 201 when created and 200
        when an existing scenario is fully replaced. Defaults are 100 stored
        scenarios, 100 response keys per scenario, and 65,536 raw JSON bytes.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayloadScenarioRequest"
      security:
        - {}
        - WriteBearerAuth: []
      responses:
        "200":
          description: Existing scenario replaced
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadScenarioSummary"
        "201":
          description: Scenario created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadScenarioSummary"
        "400":
          $ref: "#/components/responses/InvalidScenarioDocument"
        "409":
          description: A referenced response is unavailable or the scenario catalog is full
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "413":
          $ref: "#/components/responses/ScenarioTooLarge"
        "415":
          $ref: "#/components/responses/UnsupportedJsonMediaType"
        "401":
          $ref: "#/components/responses/WriteAuthenticationRequired"
        "503":
          $ref: "#/components/responses/ScenarioPersistenceFailure"
    delete:
      summary: Delete a named scenario
      security:
        - {}
        - WriteBearerAuth: []
      responses:
        "204":
          description: Scenario deleted
        "400":
          $ref: "#/components/responses/InvalidScenarioDocument"
        "404":
          $ref: "#/components/responses/ScenarioNotFound"
        "401":
          $ref: "#/components/responses/WriteAuthenticationRequired"
        "503":
          $ref: "#/components/responses/ScenarioPersistenceFailure"
  /api/responses:
    get:
      summary: List response keys
      responses:
        "200":
          description: Response catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadCatalogResponse"
  /api/responses/{key}/versions:
    parameters:
      - $ref: "#/components/parameters/Key"
    get:
      summary: List retained XML response versions
      description: >-
        Returns retained revision metadata newest-first. The newest revision is
        current and is the XML used by normal response fetches, response-set
        exports, and scenario resolution. Each successful update creates a new
        revision; newly created responses start at revision 1. Retention is
        configurable through payloadprobe.response-history.max-revisions-per-response
        and defaults to 10 revisions per response. Older revisions are read-only:
        this API provides no rollback or individual-version deletion. Deleting
        the response purges its full retained history; recreating the key starts
        again at revision 1.
      responses:
        "200":
          description: Retained response version metadata, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadResponseVersionHistory"
        "400":
          $ref: "#/components/responses/InvalidKey"
        "404":
          $ref: "#/components/responses/NotFound"
  /api/responses/{key}/versions/{revision}:
    parameters:
      - $ref: "#/components/parameters/Key"
      - $ref: "#/components/parameters/ResponseRevision"
    get:
      summary: Fetch the exact XML for one retained response version
      description: >-
        Returns exactly the XML retained for the requested revision. A revision
        that has been pruned by retention, or was never created, returns the
        same fixed 404 response. Retained versions are read-only; rollback and
        individual-version deletion are not supported.
      responses:
        "200":
          description: Retained XML response
          content:
            application/xml:
              schema:
                type: string
        "400":
          description: Invalid response key or revision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                invalidKey:
                  value:
                    message: Invalid response key. Use 1-120 letters, numbers, dots, underscores, or hyphens.
                invalidRevision:
                  value:
                    message: Invalid response revision. Use a positive whole number.
        "404":
          description: Response key does not exist, or the requested revision is not retained
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
              examples:
                missingKey:
                  value:
                    message: "No XML response found for key: example-key"
                unavailableRevision:
                  value:
                    message: No retained XML response found for revision.
  /api/responses/{key}:
    parameters:
      - $ref: "#/components/parameters/Key"
    get:
      summary: Fetch XML response
      responses:
        "200":
          description: XML response
          content:
            application/xml:
              schema:
                type: string
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/InvalidKey"
    post:
      summary: Create XML response
      requestBody:
        $ref: "#/components/requestBodies/XmlPayload"
      security:
        - {}
        - WriteBearerAuth: []
      responses:
        "201":
          $ref: "#/components/responses/MessageResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/InvalidMutationRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/WriteAuthenticationRequired"
    put:
      summary: Update XML response
      requestBody:
        $ref: "#/components/requestBodies/XmlPayload"
      security:
        - {}
        - WriteBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/MessageResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/InvalidMutationRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/WriteAuthenticationRequired"
    delete:
      summary: Delete XML response
      security:
        - {}
        - WriteBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/MessageResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/InvalidKey"
        "401":
          $ref: "#/components/responses/WriteAuthenticationRequired"
  /api/responses/default:
    post:
      summary: Return default XML sample
      responses:
        "200":
          description: Default XML
          content:
            application/xml:
              schema:
                type: string
  /actuator/health:
    get:
      summary: Health status
      responses:
        "200":
          description: Health status
  /actuator/metrics/{metricName}:
    parameters:
      - name: metricName
        in: path
        required: true
        schema:
          type: string
        example: payloadprobe.response.catalog.size
    get:
      summary: Inspect one Actuator metric
      responses:
        "200":
          description: Metric measurements and available tags
          content:
            application/vnd.spring-boot.actuator.v3+json:
              schema:
                $ref: "#/components/schemas/ActuatorMetricResponse"
        "404":
          description: Metric name not found
  /actuator/prometheus:
    get:
      summary: Scrape operational metrics
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string
  /fetch/{key}:
    parameters:
      - $ref: "#/components/parameters/Key"
    get:
      summary: Legacy fetch alias
      responses:
        "200":
          description: XML response or legacy not-found failure XML
          content:
            application/xml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidKey"
    post:
      summary: Legacy POST fetch alias
      responses:
        "200":
          description: XML response or legacy not-found failure XML
          content:
            application/xml:
              schema:
                type: string
        "400":
          $ref: "#/components/responses/InvalidKey"
  /add/{key}:
    parameters:
      - $ref: "#/components/parameters/Key"
    post:
      summary: Legacy create alias
      requestBody:
        $ref: "#/components/requestBodies/XmlPayload"
      security:
        - {}
        - WriteBearerAuth: []
      responses:
        "201":
          $ref: "#/components/responses/MessageResult"
        "409":
          $ref: "#/components/responses/Conflict"
        "400":
          $ref: "#/components/responses/InvalidMutationRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/WriteAuthenticationRequired"
  /update/{key}:
    parameters:
      - $ref: "#/components/parameters/Key"
    post:
      summary: Legacy update alias
      requestBody:
        $ref: "#/components/requestBodies/XmlPayload"
      security:
        - {}
        - WriteBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/MessageResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/InvalidMutationRequest"
        "415":
          $ref: "#/components/responses/UnsupportedMediaType"
        "401":
          $ref: "#/components/responses/WriteAuthenticationRequired"
  /delete/{key}:
    parameters:
      - $ref: "#/components/parameters/Key"
    delete:
      summary: Legacy delete alias
      security:
        - {}
        - WriteBearerAuth: []
      responses:
        "200":
          $ref: "#/components/responses/MessageResult"
        "404":
          $ref: "#/components/responses/NotFound"
        "400":
          $ref: "#/components/responses/InvalidKey"
        "401":
          $ref: "#/components/responses/WriteAuthenticationRequired"
  /fetchAll:
    get:
      summary: Legacy list alias
      responses:
        "200":
          description: Response catalog
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PayloadCatalogResponse"
  /default:
    get:
      summary: Legacy default XML alias
      responses:
        "200":
          description: Default XML
          content:
            application/xml:
              schema:
                type: string
    post:
      summary: Legacy default XML alias
      responses:
        "200":
          description: Default XML
          content:
            application/xml:
              schema:
                type: string
  /help:
    get:
      summary: Legacy endpoint catalog
      responses:
        "200":
          description: Endpoint catalog
components:
  securitySchemes:
    WriteBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque token
      description: >-
        Required only when PAYLOADPROBE_WRITE_AUTH_ENABLED=true. Supply the
        token configured through PAYLOADPROBE_WRITE_AUTH_BEARER_TOKEN as one
        Authorization: Bearer <token> header. Authentication is disabled by
        default, so the same write operations accept requests without this
        header until it is enabled.
  requestBodies:
    XmlPayload:
      required: true
      description: >-
        A non-empty, well-formed XML document or fragment containing at least one
        element. The default maximum is 262144 UTF-8 bytes. DTDs and external
        entities are rejected.
      content:
        application/xml:
          schema:
            $ref: "#/components/schemas/XmlPayload"
        text/xml:
          schema:
            $ref: "#/components/schemas/XmlPayload"
        text/plain:
          schema:
            $ref: "#/components/schemas/XmlPayload"
  responses:
    WriteAuthenticationRequired:
      description: The enabled write-authentication policy rejected the request.
      headers:
        WWW-Authenticate:
          description: Bearer authentication challenge for PayloadProbe write operations.
          schema:
            type: string
          example: Bearer realm="PayloadProbe writes"
        Cache-Control:
          description: Prevents caching of the authentication failure response.
          schema:
            type: string
          example: no-store
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Write authentication required.
    InvalidScenarioDocument:
      description: Invalid scenario name or JSON document
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Invalid scenario document.
    ScenarioNotFound:
      description: Scenario does not exist
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: No scenario found.
    ScenarioUnavailable:
      description: >-
        At least one referenced response is unavailable or the resolved bundle
        exceeds response-set export limits; no partial response set is returned
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          examples:
            unavailableResponse:
              value:
                message: Scenario references an unavailable response.
            exportLimit:
              value:
                message: Scenario exceeds the configured response-set export limit.
    ScenarioTooLarge:
      description: Raw scenario JSON exceeds the configured byte limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Scenario document exceeds the configured size limit.
    ScenarioPersistenceFailure:
      description: Atomic scenario persistence could not complete
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Scenario could not be persisted.
    ResponseSetExportTooLarge:
      description: Current catalog exceeds an export limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Current response catalog exceeds the configured response-set export limit.
    InvalidResponseSetDocument:
      description: Invalid version, structure, key, duplicate, or XML entry
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Invalid response-set document.
    ResponseSetConflict:
      description: At least one submitted key already exists; nothing was imported
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Response-set import conflicts with existing response keys.
    ResponseSetTooLarge:
      description: Raw JSON document exceeds the configured byte limit
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Response-set document exceeds the configured size limit.
    UnsupportedJsonMediaType:
      description: JSON write operations require application/json
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Unsupported Content-Type. Use application/json.
    ResponseSetPersistenceFailure:
      description: Atomic persistence could not complete; the catalog was not changed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Response-set import could not be persisted.
    MessageResult:
      description: Operation result
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    NotFound:
      description: Key not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    Conflict:
      description: Key already exists
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
    InvalidKey:
      description: Invalid response key
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Invalid response key. Use 1-120 letters, numbers, dots, underscores, or hyphens.
    InvalidMutationRequest:
      description: Invalid response key or XML payload
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          examples:
            invalidKey:
              value:
                message: Invalid response key. Use 1-120 letters, numbers, dots, underscores, or hyphens.
            blankPayload:
              value:
                message: XML response content must not be blank.
            malformedPayload:
              value:
                message: XML response content must be a well-formed XML document or fragment; DTDs and external entities are not allowed.
            oversizedPayload:
              value:
                message: XML response content exceeds the configured size limit.
    UnsupportedMediaType:
      description: Unsupported request Content-Type
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          example:
            message: Unsupported Content-Type. Use application/xml, text/xml, or text/plain.
  parameters:
    ScenarioName:
      name: name
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,120}$"
    Key:
      name: key
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-Za-z0-9._-]{1,120}$"
    ResponseRevision:
      name: revision
      in: path
      required: true
      description: Positive retained response revision number.
      schema:
        type: integer
        format: int64
        minimum: 1
      example: 2
  schemas:
    PayloadScenarioRequest:
      type: object
      additionalProperties: false
      required:
        - responseKeys
      properties:
        responseKeys:
          type: array
          minItems: 1
          uniqueItems: true
          description: Ordered response keys; the configurable limit defaults to 100.
          items:
            type: string
            pattern: "^[A-Za-z0-9._-]{1,120}$"
    PayloadScenarioSummary:
      type: object
      additionalProperties: false
      required:
        - name
        - responseCount
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,120}$"
          example: smoke
        responseCount:
          type: integer
          minimum: 1
          example: 2
    PayloadScenarioCatalogResponse:
      type: object
      additionalProperties: false
      required:
        - count
        - scenarios
      properties:
        count:
          type: integer
          minimum: 0
          example: 1
        scenarios:
          type: array
          items:
            $ref: "#/components/schemas/PayloadScenarioSummary"
    PayloadResponseVersionHistory:
      type: object
      additionalProperties: false
      required:
        - key
        - currentRevision
        - retainedCount
        - versions
      properties:
        key:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,120}$"
          example: paymentSuccess
        currentRevision:
          type: integer
          format: int64
          minimum: 1
          example: 3
        retainedCount:
          type: integer
          minimum: 1
          description: Number of retained revisions, bounded by the configured retention limit (10 by default).
          example: 3
        versions:
          type: array
          minItems: 1
          description: Retained versions in newest-first order.
          items:
            $ref: "#/components/schemas/PayloadResponseVersionSummary"
    PayloadResponseVersionSummary:
      type: object
      additionalProperties: false
      required:
        - revision
        - current
      properties:
        revision:
          type: integer
          format: int64
          minimum: 1
          example: 3
        current:
          type: boolean
          description: Whether this is the newest revision used by the active response catalog.
          example: true
    ResponseSetDocument:
      type: object
      additionalProperties: false
      required:
        - version
        - responses
      properties:
        version:
          type: integer
          enum:
            - 1
        responses:
          type: array
          description: Exports may be empty. The configurable entry limit defaults to 100.
          items:
            $ref: "#/components/schemas/ResponseSetEntry"
    ResponseSetImportDocument:
      type: object
      additionalProperties: false
      required:
        - version
        - responses
      properties:
        version:
          type: integer
          enum:
            - 1
        responses:
          type: array
          minItems: 1
          description: Import requests must contain at least one entry; the configurable entry limit defaults to 100.
          items:
            $ref: "#/components/schemas/ResponseSetEntry"
    ResponseSetEntry:
      type: object
      additionalProperties: false
      required:
        - key
        - xml
      properties:
        key:
          type: string
          pattern: "^[A-Za-z0-9._-]{1,120}$"
        xml:
          $ref: "#/components/schemas/XmlPayload"
    ResponseSetImportResponse:
      type: object
      additionalProperties: false
      required:
        - imported
      properties:
        imported:
          type: integer
          minimum: 1
          description: Number imported, bounded by the configured entry limit (100 by default).
          example: 2
    XmlPayload:
      type: string
      minLength: 1
      description: XML document or fragment; the byte limit is enforced after UTF-8 encoding.
      example: <response><status>success</status></response>
    ActuatorMetricResponse:
      type: object
      required:
        - name
        - measurements
        - availableTags
      properties:
        name:
          type: string
          example: payloadprobe.response.catalog.size
        description:
          type: string
          nullable: true
          example: Current number of stored XML response keys.
        measurements:
          type: array
          items:
            $ref: "#/components/schemas/ActuatorMeasurement"
        availableTags:
          type: array
          items:
            $ref: "#/components/schemas/ActuatorAvailableTag"
    ActuatorMeasurement:
      type: object
      required:
        - statistic
        - value
      properties:
        statistic:
          type: string
          example: VALUE
        value:
          type: number
          format: double
          example: 3.0
    ActuatorAvailableTag:
      type: object
      required:
        - tag
        - values
      properties:
        tag:
          type: string
          example: operation
        values:
          type: array
          items:
            type: string
          example:
            - create
            - update
            - delete
    PayloadCatalogResponse:
      type: object
      required:
        - count
        - keys
      properties:
        count:
          type: integer
          example: 3
        keys:
          type: array
          items:
            type: string
          example:
            - openTest
            - paymentSuccess
    MessageResponse:
      type: object
      required:
        - message
      properties:
        message:
          type: string
          example: "Response created for key: paymentSuccess"
