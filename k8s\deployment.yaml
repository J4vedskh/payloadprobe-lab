apiVersion: apps/v1
kind: Deployment
metadata:
  name: payloadprobe
  namespace: payloadprobe
  labels:
    app: payloadprobe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payloadprobe
  template:
    metadata:
      labels:
        app: payloadprobe
    spec:
      containers:
        - name: payloadprobe
          image: ghcr.io/j4vedskh/payloadprobe-lab:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: PAYLOADPROBE_STORE_PATH
              value: /data/xmlResponses.json
          volumeMounts:
            - name: response-store
              mountPath: /data
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
      volumes:
        - name: response-store
          emptyDir: {}
